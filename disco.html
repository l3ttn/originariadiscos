<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Disco | Originária Discos</title>
  <meta name="description" content="Ficha do disco: faixas, formato, prensagem e atendimento direto pelo WhatsApp.">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/intro.js"></script>
</head>
<body>
  <header class="header">
    <div class="header__inner container">
      <a class="header__logo" href="index.html">
        <img src="img/logo.svg" alt="Originária Discos" width="170" height="32">
      </a>
      <nav class="header__nav" aria-label="Navegação principal">
        <a href="catalogo.html">Catálogo</a>
        <a href="index.html#colecoes">Coleções</a>
        <a href="index.html#novidades">Novidades</a>
        <a href="index.html#como-funciona">Como funciona</a>
      </nav>
      <a class="header__carrinho" href="carrinho.html">Carrinho <span class="header__contador" data-contador>0</span></a>
      <a class="btn btn--whatsapp" id="whatsapp-header" href="#" target="_blank" rel="noopener">Fale no WhatsApp</a>
    </div>
  </header>

  <main>
    <section>
      <div class="container">
        <div id="disco-root">
          <div class="ficha" aria-hidden="true">
            <div class="skeleton-bloco" style="aspect-ratio: 1 / 1; border-radius: var(--raio);"></div>
            <div>
              <div class="skeleton-bloco skeleton-linha-larga" style="width: 40%; margin-bottom: 0.85rem;"></div>
              <div class="skeleton-bloco skeleton-linha-larga" style="margin-bottom: 0.6rem;"></div>
              <div class="skeleton-bloco skeleton-linha-larga" style="width: 70%; margin-bottom: 1.5rem;"></div>
              <div class="skeleton-bloco" style="height: 2.6rem; border-radius: var(--raio); margin-bottom: 0.6rem;"></div>
              <div class="skeleton-bloco" style="height: 2.6rem; border-radius: var(--raio);"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__inner container">
      <p class="footer__loja">Originária Discos</p>
      <nav class="footer__links" aria-label="Redes e contato">
        <a id="instagram-footer" href="#" target="_blank" rel="noopener">Instagram</a>
        <a id="whatsapp-footer" href="#" target="_blank" rel="noopener">WhatsApp</a>
      </nav>
      <p class="footer__atribuicao"><a href="https://www.discogs.com" target="_blank" rel="noopener">Data provided by Discogs</a>. Não afiliado ao Discogs.</p>
    </div>
  </footer>

  <script type="module" src="js/pagina-disco.js"></script>
</body>
</html>
